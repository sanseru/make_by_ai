name: Build Perjadin APK

on:
  push:
    paths:
      - "apps/perjadin/**"
      - ".github/workflows/perjadin-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perjadin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04  # dipin agar tidak ikut migrasi otomatis ke Ubuntu 26
    defaults:
      run:
        working-directory: apps/perjadin
    env:
      # Opsional: isi secrets ini untuk menandatangani APK dengan kunci rilis sendiri
      KEYSTORE_BASE64: ${{ secrets.PERJADIN_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Siapkan keystore rilis (opsional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "PERJADIN_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "PERJADIN_KEYSTORE_PASSWORD=${{ secrets.PERJADIN_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "PERJADIN_KEY_ALIAS=${{ secrets.PERJADIN_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "PERJADIN_KEY_PASSWORD=${{ secrets.PERJADIN_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Perjadin-v1.0.${GITHUB_RUN_NUMBER}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: Perjadin-apk
          path: apps/perjadin/dist/*.apk

      - name: Publikasikan ke GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: perjadin-v1.0.${{ github.run_number }}
          name: Perjadin v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            APK aplikasi Perjadin (Catatan Perjalanan Dinas) dari commit ${{ github.sha }}.
            Unduh file .apk di bawah ini dari HP Android, lalu install (izinkan "Install dari sumber tidak dikenal").
          files: apps/perjadin/dist/*.apk
